name: app

networks:
  app-network:
    driver: bridge

volumes:
  postgres-data:
  minio-data:

services:

  # 1. Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_WEB_URL=http://localhost:3000
    networks:
      - app-network

  # 2. Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql+psycopg://appuser:apppassword@postgres:5432/appdb
      - REDIS_URL=redis://redis:6379
      - MINIO_URL=http://minio:9000
      - SUPERTOKENS_CONNECTION_URI=http://supertokens:3567
      - SUPERTOKENS_API_KEY=Pass-12345678901234567890
    volumes:
      - ./backend/src:/app/src
      - ./backend/alembic:/app/alembic
      - ./backend/alembic.ini:/app/alembic.ini
    depends_on:
      - postgres
      - redis
      - minio
      - supertokens
    networks:
      - app-network

  # 3. PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    ports:
      - "5432:5432" # Accessible on localhost:5432
    environment:
      - POSTGRES_USER=appuser
      - POSTGRES_PASSWORD=apppassword
      - POSTGRES_DB=appdb
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app-network

  # 4. Redis
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - app-network

  # 5. MinIO (S3 Alternative)
  minio:
    image: quay.io/minio/minio:latest
    container_name: minio
    restart: unless-stopped
    ports:
      - "9000:9000" # API
      - "9001:9001" # Web Console
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin123
    volumes:
      - minio-data:/data
    networks:
      - app-network

  # 6. LiveKit Server
  livekit:
    image: livekit/livekit-server:latest
    container_name: livekit
    restart: unless-stopped
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    # Livekit requires a minimal dev config. It can be passed via command line flags for local dev.
    command: --dev --bind 0.0.0.0 --node-ip 127.0.0.1 --redis-host redis:6379 --redis-password ""
    depends_on:
      - redis
    networks:
      - app-network

  # 7. SuperTokens
  supertokens:
    image: registry.supertokens.io/supertokens/supertokens-postgresql:latest
    container_name: supertokens
    restart: unless-stopped
    ports:
      - "3567:3567"
    environment:
      - POSTGRESQL_CONNECTION_URI=postgresql://appuser:apppassword@postgres:5432/appdb
      - API_KEYS=Pass-12345678901234567890
    depends_on:
      - postgres
    networks:
      - app-network

  # 8. pgAdmin
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@admin.com
      - PGADMIN_DEFAULT_PASSWORD=admin
      - PGADMIN_CONFIG_SERVER_MODE=False
    volumes:
      - ./backend/src:/app/src
      - ./backend/alembic:/app/alembic
      - ./backend/alembic.ini:/app/alembic.ini
    depends_on:
      - postgres
      - redis
    networks:
      - app-network

  # 9. ARQ Background Worker
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend-worker
    restart: unless-stopped
    command: arq src.worker.WorkerSettings
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql+psycopg://appuser:apppassword@postgres:5432/appdb
      - REDIS_HOST=redis
    volumes:
      - ./backend/src:/app/src
      - ./backend/alembic:/app/alembic
      - ./backend/alembic.ini:/app/alembic.ini
    depends_on:
      - redis
      - postgres
    networks:
      - app-network
